<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Darren Video Helper Options</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="panel">
      <header>
        <div class="brand">
          <img src="icons/icon48.png" alt="">
          <div>
            <h1>Darren Video Helper</h1>
            <p>Universal Web Video Downloader</p>
          </div>
        </div>
        <p id="status">Options</p>
      </header>

      <label>
        <span>Native Host 下载目录（Chrome 直接下载使用浏览器默认下载目录）</span>
        <input id="outputDir" type="text" spellcheck="false">
      </label>

      <label>
        <span>默认清晰度</span>
        <select id="defaultQuality">
          <option value="best">best</option>
          <option value="1080p">1080p</option>
          <option value="720p">720p</option>
          <option value="480p">480p</option>
        </select>
      </label>

      <label>
        <span>最大并发数</span>
        <input id="maxConcurrent" type="number" min="1" max="6" step="1">
      </label>

      <label><span>完整版网络重试上限（0–8）</span><input id="networkRetries" type="number" min="0" max="8" step="1"></label>
      <label><span>完整版单次网络超时（2–60 秒）</span><input id="networkTimeout" type="number" min="2" max="60" step="1"></label>
      <section class="checks">
        <label><input id="autoCookies" type="checkbox"> 允许页面解析读取本机 Chrome Cookie（可选，默认关闭）</label>
        <label><input id="skipDownloaded" type="checkbox"> 下载前提示曾下载（可强制重下）</label>
        <label><input id="nativeDirect" type="checkbox"> Full：直接 MP4/WebM 使用 Native Host 下载（特殊请求头／转 MP4）</label>
        <label><input id="onlyMp4" type="checkbox"> Native Host 优先输出 MP4</label>
        <label><input id="showAdvanced" type="checkbox"> 显示高级候选项</label>
      </section>

      <div class="actions">
        <button id="saveButton" class="primary" type="button">Save</button>
        <button id="clearHistoryButton" type="button">清理下载历史</button>
      </div>
    </main>

    <script src="options.js"></script>
  </body>
</html>
